[project]
name = "gweiops-engine"
version = "0.1.0"
description = "GweiOps 核心引擎"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "dbos>=2.31.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "litellm>=1.89.0",
    # 控制台助手的 agent loop(工具执行、多步、事件流)。
    # `bub.builtin.model` 的 import 会拉进 `bub.builtin` 包级 __init__,那里要
    # framework(typer / pluggy),所以必须带 [app] extras,否则 import 不到 BubModel。
    "bub[app]>=0.6.1",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    # App JWT 认证需要 auth-app extra(client.py 用 AppInstallationAuthStrategy)
    "githubkit[auth-app]>=0.12.0",
    "grpcio>=1.85.1",
    "grpcio-tools>=1.85.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # 控制台助手的用例用内存 SQLite 当那份库,不碰部署里的 Postgres
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
