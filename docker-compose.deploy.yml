# =============================================================================
# Gwei — CI 部署编排（自包含，不叠加其它 compose 文件）
# 使用方式：docker compose -f docker-compose.deploy.yml up -d
#
# 与 docker-compose.prod.yml 的区别：
#   - prod.yml 在目标机本机 build 镜像（单机自用起步）；
#   - 本文件拉 CI 已 build & push 到制品库的镜像，目标机不装任何构建工具。
#
# 所有变量从 .env.prod 读（--env-file .env.prod 或同目录自动加载）。
# 镜像地址由 GWEI_ENGINE_IMAGE / GWEI_WEB_IMAGE 给出，含 tag 的完整地址：
#   docker.cnb.cool/<org>/<repo>:<tag>
# CI 每次部署把这两个值写进 .env.prod，旧值留在 .deploy-before.env 供回滚。
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gwei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gwei
      POSTGRES_USER: gwei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwei"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gwei-network]

  redis:
    image: redis:7-alpine
    container_name: gwei-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gwei-network]

  engine:
    image: ${GWEI_ENGINE_IMAGE:?必须设置 GWEI_ENGINE_IMAGE（含 tag 的完整镜像地址）}
    container_name: gwei-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://gwei:${POSTGRES_PASSWORD}@postgres:5432/gwei"
      REDIS_URL: "redis://redis:6379/0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: gwei
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_TOKENS: ${API_TOKENS:?必须设置 API_TOKENS}
      PLATFORM_BASE_URL: "http://engine:8000"
      HARNESS_WORKSPACE_ROOT: /workspaces
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      RELEASE_PROJECT_DIR: ${RELEASE_PROJECT_DIR:-}
      RELEASE_SERVICE: ${RELEASE_SERVICE:-}
      RELEASE_IMAGE_TEMPLATE: ${RELEASE_IMAGE_TEMPLATE:-}
      RELEASE_BINDING: ${RELEASE_BINDING:-local}
      RELEASE_BASE_BRANCH: ${RELEASE_BASE_BRANCH:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      CNB_BASE_URL: ${CNB_BASE_URL:-https://api.cnb.cool}
      CNB_WEBHOOK_TOKEN: ${CNB_WEBHOOK_TOKEN:-}
      CNB_WEBHOOK_HEADER: ${CNB_WEBHOOK_HEADER:-X-Cnb-Token}
      CNB_TOKEN: ${CNB_TOKEN:-}
      PLUGINS_EXTRA_DIRS: /plugins-extra
      PLUGINS_GRPC_TIMEOUT_S: ${PLUGINS_GRPC_TIMEOUT_S:-10}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # harness 是引擎用 HARNESS_COMMAND(docker run)拉起来的,回调要带令牌。
      # 鉴权开着时少了它们:沙箱起不来,或者起来后第一次出口调用 401。
      HARNESS_COMMAND: ${HARNESS_COMMAND:-}
      HARNESS_TOKEN: ${HARNESS_TOKEN:-}
      SANDBOX: ${SANDBOX:-local}
    volumes:
      - harness-workspace:/workspaces
      - ${PLUGINS_EXTRA_DIR:-./plugins-extra}:/plugins-extra:ro
      # 本地沙箱要替事故起 harness 容器:引擎容器里得有宿主 docker 的入口。
      # 用远端沙箱(SSH / CNB)时删掉这一行。
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks: [gwei-network]

  web:
    image: ${GWEI_WEB_IMAGE:?必须设置 GWEI_WEB_IMAGE（含 tag 的完整镜像地址）}
    container_name: gwei-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: "/api"
      NUXT_PUBLIC_USE_MOCK: "false"
      NUXT_PUBLIC_DEPLOYMENT_MODE: "selfhost"
      NUXT_ENGINE_URL: "http://engine:8000"
    depends_on:
      engine:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks: [gwei-network]

volumes:
  postgres-data:
  redis-data:
  harness-workspace:
    name: gwei-harness-workspace

networks:
  gwei-network:
    name: gwei-network
    driver: bridge
