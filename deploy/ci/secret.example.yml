# 密钥仓库文件模板(例如 ChenXu233/secrets 里的 gwei-deploy.yml)。
# 复制时把值换成真实的,在密钥仓库 Web 界面编辑,不要提交到本仓库。
#
# 引用方必须在 .cnb.yml 的 imports 里指向这个文件。因为它是跨仓库私有文件,
# 文件内要声明 allow_* 把范围收紧到本仓库 + 仅部署事件。
# 这里用的是脚本阶段(不是插件任务),所以不设 allow_images。
#   allow_slugs:
#     - ChenXu233/gweiops
#   allow_events:
#     - "tag_deploy.*"
#
allow_slugs:
  - ChenXu233/gweiops
allow_events:
  - "tag_deploy.*"

# 目标机 SSH。内网机器用 proxy_* 走跳板机(见 README 内网说明);
# 公网可达时可把 proxy_* 这几行删掉。
REMOTE_HOST: 10.0.0.10
REMOTE_PORT: 22
REMOTE_USER: root
REMOTE_KEY: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  <粘贴私钥明文>
  -----END OPENSSH PRIVATE KEY-----
# 经跳板机访问内网目标机时才填;留空则直连。
PROXY_HOST: ""
PROXY_PORT: 22
PROXY_USER: ""
PROXY_KEY: ""
