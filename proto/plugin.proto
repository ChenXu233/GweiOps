syntax = "proto3";

package gweiops.plugin;

// ============================================================
// 插件服务定义
// ============================================================

service PluginService {
    // 生命周期
    rpc Startup(StartupRequest) returns (StartupResponse);
    rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
    rpc HealthCheck(HealthRequest) returns (HealthResponse);

    // 配置下发：核心把某个 scope 的当前值推给插件。连接方向只有核心 → 插件这一面，
    // 所以配置是"推"下来的，插件不反向索取。
    rpc Configure(ConfigureRequest) returns (ConfigureResponse);

    // 事件处理
    rpc HandleEvent(EventRequest) returns (EventResponse);

    // 任务执行
    rpc ExecuteTask(TaskRequest) returns (TaskResponse);

    // Hook 回调：插件在清单里订阅了扩展点，核心按优先级调到这里
    rpc HandleHook(HookRequest) returns (HookResponse);
}

// ============================================================
// 插件信息
// ============================================================

message PluginInfo {
    string name = 1;
    string version = 2;
    PluginType type = 3;
    string description = 4;
    repeated TriggerInfo triggers = 5;
    repeated string capabilities = 6;
    // v2 增量（wire-compatible）：Hook 声明与能力元数据
    repeated string hooks_offered = 7;
    repeated HookSubscription hooks_subscribed = 8;
    // 能力名 -> execute_task 任务名映射（缺省为能力名下划线形式）
    map<string, string> tasks = 9;
    // 能力名 -> 覆盖优先级（缺省 0，高者优先）
    map<string, int32> capabilities_priority = 10;
}

message HookSubscription {
    string point = 1;          // 扩展点，如 "comment.posting"
    string mode = 2;           // observe | transform | veto
    int32 priority = 3;
    string failure_mode = 4;   // fail_open | fail_closed
    string handler = 5;        // 插件实例上的方法名，缺省 handle_hook
}

enum PluginType {
    ADAPTER = 0;
    AGENT = 1;
    ACTION = 2;
    DASHBOARD_COMPONENT = 3;
}

message TriggerInfo {
    string type = 1;  // "event" 或 "webhook"
    repeated string events = 2;  // 事件类型列表
    string path = 3;  // Webhook 路径
}

// ============================================================
// 生命周期消息
// ============================================================

// 插件要哪些配置由清单声明（scopes 块），不走 wire：进程没连上时控制台也要能
// 把"它缺哪几项"讲清楚。
message StartupRequest {
    PluginInfo plugin_info = 1;
}

message StartupResponse {
    bool success = 1;
    string message = 2;
}

message ShutdownRequest {}

message ShutdownResponse {
    bool success = 1;
}

message HealthRequest {}

message HealthResponse {
    bool healthy = 1;
    string message = 2;
}

// ============================================================
// 配置下发消息
// ============================================================

// 一次下发一个 scope 的全部值：插件按 scope 拿，不做增量合并——增量会让
// "删掉一个键"和"这个键没改过"在插件侧长得一样。
message ConfigureRequest {
    string scope = 1;                 // scope 名，如 "adapter-acme"
    map<string, string> config = 2;   // 此刻的值
    repeated string missing = 3;      // 必填但还没填的键名
}

message ConfigureResponse {
    bool success = 1;
    string message = 2;
}

// ============================================================
// 事件处理消息
// ============================================================

message EventRequest {
    string event = 1;
    bytes data = 2;
    map<string, string> metadata = 3;
}

message EventResponse {
    bool success = 1;
    bytes result = 2;
    string error = 3;
}

// ============================================================
// Hook 回调消息
// ============================================================

message HookRequest {
    string point = 1;          // 扩展点，如 "comment.posting"
    string mode = 2;           // observe | transform | veto
    bytes payload = 3;         // 当前载荷(JSON)
}

message HookResponse {
    bool allowed = 1;          // veto 模式下 false 即短路
    bytes payload = 2;         // transform 模式下替换后的载荷(JSON)
    string error = 3;
}

// ============================================================
// 任务执行消息
// ============================================================

// 效果(execute / undo / window / verify)复用 ExecuteTask，不单独开 rpc。
// 阶段放在 metadata["phase"] 里；没有 phase 就是一次普通的能力调用。
//
//   phase=execute  task = effects.<cap>.execute.task   params = 效果参数
//   phase=undo     task = effects.<cap>.undo.task      params = {"args": {...}, "handle": "..."}
//   phase=window   task = 能力名                        params = {"effect": {...}, "handle": null}
//   phase=verify   task = 能力名                        params = {"effect": {...}, "handle": "..."}
//
// window 的 result：{"seconds": n} / {"unbounded": true} / {"source": "..."}
// verify 的 result：{"ok": bool, "facts": {...}}
message TaskRequest {
    string task = 1;
    bytes params = 2;
    map<string, string> metadata = 3;
}

message TaskResponse {
    bool success = 1;
    bytes result = 2;
    string error = 3;
    // 失败的性质。"not_applied" = 远端确定没碰到下游，核心据此把单元记成
    // failed（可以照原样重试）；其它值或不填 = 说不清，一律按 unknown 处理。
    // 这个区分只有远端知道，核心不替它猜。
    string error_kind = 4;
}
