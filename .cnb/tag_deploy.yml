# 自定义部署环境。在这里选环境与镜像通道，触发 .cnb.yml 里的 tag_deploy.* 流水线。
# 部署是可信事件：默认只有仓库写权限且能推 tag 的人能点；CNB_TOKEN 带 registry-package:rw，
# 能拉制品库镜像。生产环境额外限制到 master/owner。
environments:
  - name: dogfood
    description: 生产/dogfood 部署——把指定 tag 的镜像切到 stable 通道
    permissions:
      roles: [master, owner]
    env:
      name: dogfood
      channel: stable
      tag_name: $CNB_BRANCH

  - name: test
    description: 测试部署——把指定 tag 的镜像切到 test-stable 通道，NPC 用这一套
    env:
      name: test
      channel: test-stable
      tag_name: $CNB_BRANCH
