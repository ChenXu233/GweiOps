# CNB 流水线
#
# **主场是 CNB,GitHub 上的 ChenXu233/GweiOps 是镜像。**
# 往 master 推一次,这条流水线就把 master 与 tag 同步过去;GitHub 那边不要再手工推,
# 下次同步会把分叉覆盖掉。
#
# 同步作业不设"没配凭据就跳过":看起来在同步、其实一直停在某个旧提交,比一条红色的
# 流水线难发现得多。变量缺失时作业直接失败。
#
# 密钥:CNB 没有 from_secret,敏感值放密钥仓库用 imports 注入。
# 密钥仓库 https://cnb.cool/ChenXu233/secrets 的 github-sync.yml 里是
# GITHUB_USERNAME / GITHUB_TOKEN,与 oh-my-dsh-pack 用的是同一份。
# 注意那份文件必须是 YAML(GITHUB_USERNAME: "x");dotenv 的 KEY=VALUE 会被判成非法。

master:
  push:
    - imports: https://cnb.cool/ChenXu233/secrets/-/blob/main/github-sync.yml
      stages:
        - name: sync to github (mirror)
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ChenXu233/GweiOps.git
            auth_type: https
            username: "${GITHUB_USERNAME}"
            password: "${GITHUB_TOKEN}"
            branch: master
            # 镜像是单向的:GitHub 上被谁改过,这里一律覆盖成 CNB 的样子
            force: true
            push_tags: true

# 打 tag 时三件事都要做:同步镜像仓、发制品、正式版自动部署。v* 这个事件下的
# 每个 tag_push 条目都是并列的,不是覆盖——各自独立触发,一个红不拦另一个。
#
# "正式版"的判定只认 tag 名:$CNB_BRANCH 以 v 开头、且不带 - 后缀。v1.2.3 算,
# v1.2.3-rc1 / v1.2.3-beta.1 / v1.2.3-anything 都不算:rc 这类预发布 tag 照常
# 同步与发制品,但不碰 stable 通道,不会误上生产。判定在流水线里做,不放行给 tag
# 名 glob——glob 只能写 v*,表达不了"v 开头但不能有连字符"。
"v*":
  tag_push:
    - imports: https://cnb.cool/ChenXu233/secrets/-/blob/main/github-sync.yml
      stages:
        - name: sync tag to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ChenXu233/GweiOps.git
            auth_type: https
            username: "${GITHUB_USERNAME}"
            password: "${GITHUB_TOKEN}"
            branch: master
            force: true
            push_tags: true

    # 发布制品:一个 tag = 两个镜像,推完 master 再打 tag。
    #
    # tag_push 属于可信事件,${CNB_TOKEN} 带 registry-package:rw,login 后可直接推。
    # 工作流不通 docker:compose 里 engine/web 写的就是 GHCR 的名字,这里只负责把
    # 镜像按 tag 送进制品的库,拉取地址见 README 的「发布制品」。
    #
    # 两条流水线而不是一条串行:engine 与 web 互不依赖,一个失败不该拦下另一个。
    - name: release engine image
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: build and push
          script: |
            set -euo pipefail
            # tag 名带 v 前缀,v0.2.0 也照原样落成 tag,不替人改写版本号
            docker build \
              -f engine/Dockerfile \
              -t "${IMAGE}:${CNB_BRANCH}" \
              -t "${IMAGE}:latest" \
              .
            docker push "${IMAGE}:${CNB_BRANCH}"
            docker push "${IMAGE}:latest"

    # 两个镜像进同一个制品库仓库,靠 tag 后缀区分(<tag>-web)。
    # 不要用 <repo>-web 当仓库名:制品库按仓库授写权,新建的那个会拿到
    # "requested access to the resource is denied" —— 构建成功、推送被拒。
    - name: release web image
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: build and push
          script: |
            set -euo pipefail
            docker build \
              -f frontend/Dockerfile \
              -t "${IMAGE}:${CNB_BRANCH}-web" \
              -t "${IMAGE}:latest-web" \
              ./frontend
            docker push "${IMAGE}:${CNB_BRANCH}-web"
            docker push "${IMAGE}:latest-web"

    # 正式版 tag 自动部署:只做一次 CNB 内部事件调用,把 stable 指向这个 tag。
    # 部署作业仍由 tag_deploy.dogfood 统一执行,凭据和踢目标机 hook 都留在那里。
    # 这样构建侧不需要访问生产域名,不受 CNB 动态出口 IP 被目标机拦截的影响。
    # 推 v* tag 即可上线,不必再去页面点「部署到 dogfood」。
    #
    # 只切 stable(生产);测试通道由页面「部署到 test」显式控制,不受这里影响。
    # 推 tag 权限应收紧到负责人/管理员;若要人工闸口,删掉本作业,
    # 退回 README 里「点部署」的半自动流程。
    - name: auto deploy stable on release tag
      stages:
        # tag 名在 $CNB_BRANCH。正式版 = v 开头且无连字符;rc/beta 等预发布带 -,
        # 这里导出 is_release=false,后面调用 stage 的 if 便整体跳过。
        - name: 判定是否正式版 tag
          # 默认 shell 是 sh(dash),不用 [[ ]] 这类 bash 语法。case 全 POSIX。
          script: |
            set -eu
            case "$CNB_BRANCH" in
              v*)
                case "$CNB_BRANCH" in
                  *-*) echo "预发布 tag($CNB_BRANCH),不自动部署"
                       echo '##[set-output is_release=false]' ;;
                  *)   echo "正式版 tag($CNB_BRANCH),自动部署 stable"
                       echo '##[set-output is_release=true]' ;;
                esac ;;
              *) echo "非 v 前缀 tag($CNB_BRANCH),不自动部署"
                 echo '##[set-output is_release=false]' ;;
            esac
          exports:
            is_release: IS_RELEASE
        # cnb:apply 只触发当前仓库的自定义事件,不访问目标机公网地址。
        # sync: true 让部署失败时这枚 tag_push 作业一起变红。
        - name: 调用 stable 部署流水线
          if: '[ "$IS_RELEASE" = "true" ]'
          type: cnb:apply
          options:
            event: api_trigger_deploy_stable
            sync: true
          exports:
            lastJobExports.BUILD_LOG_URL: DEPLOY_BUILD_LOG_URL

# ---------------------------------------------------------------------------
# 校验作业:PR 与 master 推送都跑,不合就红。
# 这是合入门槛的唯一实现——GitHub 侧的 workflows 只构建、不校验。
#
# 两段各用各的现成镜像,不现建 docker 镜像:
# - Python 段在 python:3.12 里跑,依赖由 uv 按 engine/uv.lock 装；
# - 前端段在 node:22 + pnpm 10.15 里跑,依赖由 pnpm 按 frontend/pnpm-lock.yaml 装。
#
# 工具链要现装:python:3.12 与 node:22 里都没有 uv / pnpm,阶段里先装再跑脚本。
# 这一步不能挪进 .ci/*.sh——脚本要能在本地原样跑,而那台机器上 uv 早就有了。
#
# 曾经用 `docker.build: .ci/Dockerfile` 现建一个"什么都有"的校验镜像,连挂三次:
# 平台的 docker build 给的 context 只含 Dockerfile 本身,`COPY engine/...` 一律
# not found,而报错只说 checksum 算不出来。两段的工具链本来就不一样,分开反而更短。
#
# 命令与它为什么这么写,见 CI-CHECKS.md。
# ---------------------------------------------------------------------------

"$":
  pull_request:
    - stages:
        - name: engine tests
          image: python:3.12
          script: bash .ci/engine-tests.sh
        - name: web checks
          image: node:22
          script: |
            corepack enable
            corepack prepare pnpm@10.15.0 --activate
            bash .ci/web-checks.sh
  push:
    - stages:
        - name: engine tests
          image: python:3.12
          script: bash .ci/engine-tests.sh
        - name: web checks
          image: node:22
          script: |
            corepack enable
            corepack prepare pnpm@10.15.0 --activate
            bash .ci/web-checks.sh


  # 内部部署入口:只被正式版 tag_push 经 cnb:apply 调用。
  # 显式复用 tag_deploy.dogfood 的部署作业,不在 tag_push 里另写一套。
  # 必须待在同一个 "$" 块里:再写一个顶层 "$" 是重复键,平台直接判语法错。
  api_trigger_deploy_stable:
    - name: promote stable
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        CHANNEL: stable
        DEPLOY_HOOK_URL: ${DEPLOY_HOOK_URL:-https://gwei.chenxu233.cn/_deploy}
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 把通道指到这个 tag
          script: |
            set -euo pipefail
            TAG="$CNB_BRANCH"
            promote() {
              SRC="${IMAGE}:${TAG}$1"
              DST="${IMAGE}:${CHANNEL}$1"
              docker pull -q "$SRC" >/dev/null
              docker tag "$SRC" "$DST"
              docker push -q "$DST" >/dev/null
              echo "  $DST <= $SRC"
            }
            promote ""
            promote "-web"
            echo "${CHANNEL} -> ${TAG}；对应目标机一分钟内自取"
            echo "##[set-output build_log_url=${CNB_BUILD_WEB_URL}]"
          exports:
            build_log_url: BUILD_LOG_URL
        - name: 踢一下目标机
          script: |
            set -euo pipefail
            # 目标机上的 hook 只回答"再看一眼本环境通道",不接受版本号:
            # 接受哪一版由制品库决定,所以这个入口没有可利用的参数。
            # 没配 URL 就跳过——轮询兜底,别让作业因此变红。
            if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
              echo "没有配置 DEPLOY_HOOK_URL,交给目标机轮询"
              exit 0
            fi
            curl -fsS --max-time 300 -X POST "${DEPLOY_HOOK_URL}" \
              -H "X-Gwei-Channel: ${CHANNEL}" \
              ${DEPLOY_HOOK_TOKEN:+-H "X-Gwei-Token: ${DEPLOY_HOOK_TOKEN}"}
            echo


# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 部署 CI：目标机自己取。
#
# 触发：在仓库页面给一个 tag 点「部署到 dogfood」或「部署到 test」
# (环境定义在 .cnb/tag_deploy.yml)。这里只做一件事——把所选通道的 engine/web
# 两个 tag 指到这个版本。真正的切换在目标机：每套部署各有一个 watcher，盯着自己的
# 通道 digest，变了就跑 remote-deploy.sh（拉镜像、切流、验 /api/health，失败按
# .deploy-before.env 回滚）。
#
# 两套部署靠不同的制品通道隔离：生产看 stable，测试看 test-stable。
# 构建侧不连目标机。原先由构建侧 SSH 进来，云厂商的主机安全会把构建节点的出口
# IP 当可疑来源封掉 22 端口，那条路会断在 Connection refused，而那一层是控制台
# 策略，机器里改不干净。
# ---------------------------------------------------------------------------

# 发布与部署因此是两件事：推 v* tag 只发制品，点部署才挪通道。
# 点完按钮还要立即触发目标机 hook，省掉等待下一轮轮询；轮询仍保留作兜底。
# DEPLOY_HOOK_URL 有默认值(本机)；没配就跳过，作业不会因此变红。DEPLOY_HOOK_TOKEN 可选。

  tag_deploy.dogfood:
    - name: promote stable
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        CHANNEL: ${channel:-stable}
        DEPLOY_HOOK_URL: ${DEPLOY_HOOK_URL:-https://gwei.chenxu233.cn/_deploy}
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 把通道指到这个 tag
          script: |
            set -euo pipefail
            TAG="${tag_name:-$CNB_BRANCH}"
            # 部署方向反过来：目标机看通道 digest。这里只挪指针，不碰目标机。
            # 走 pull/tag/push 而不是 buildx imagetools：后者在目标 tag 已存在时的行为
            # 随 registry 而异，同一个 tag 重复点部署会直接报错。这条路径不依赖 buildx，
            # 重复执行也只是把同一个 digest 再写一遍。
            promote() {
              SRC="${IMAGE}:${TAG}$1"
              DST="${IMAGE}:${CHANNEL}$1"
              docker pull -q "$SRC" >/dev/null
              docker tag "$SRC" "$DST"
              docker push -q "$DST" >/dev/null
              echo "  $DST <= $SRC"
            }
            promote ""
            promote "-web"
            echo "${CHANNEL} -> ${TAG}；对应目标机一分钟内自取"
        - name: 踢一下目标机
          script: |
            set -euo pipefail
            # 目标机上的 hook 只回答"再看一眼本环境通道",不接受版本号:
            # 接受哪一版由制品库决定,所以这个入口没有可利用的参数。
            # 没配 URL 就跳过——轮询兜底,别让作业因此变红。
            if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
              echo "没有配置 DEPLOY_HOOK_URL,交给目标机轮询"
              exit 0
            fi
            curl -fsS --max-time 300 -X POST "${DEPLOY_HOOK_URL}" \
              -H "X-Gwei-Channel: ${CHANNEL}" \
              ${DEPLOY_HOOK_TOKEN:+-H "X-Gwei-Token: ${DEPLOY_HOOK_TOKEN}"}
            echo

  tag_deploy.test:
    - name: promote test-stable
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        CHANNEL: ${channel:-test-stable}
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 把通道指到这个 tag
          script: |
            set -euo pipefail
            TAG="${tag_name:-$CNB_BRANCH}"
            promote() {
              SRC="${IMAGE}:${TAG}$1"
              DST="${IMAGE}:${CHANNEL}$1"
              docker pull -q "$SRC" >/dev/null
              docker tag "$SRC" "$DST"
              docker push -q "$DST" >/dev/null
              echo "  $DST <= $SRC"
            }
            promote ""
            promote "-web"
            echo "${CHANNEL} -> ${TAG}；测试目标机一分钟内自取"
        - name: 踢一下目标机
          script: |
            set -euo pipefail
            # 目标机上的 hook 只回答"再看一眼本环境通道",不接受版本号:
            # 接受哪一版由制品库决定,所以这个入口没有可利用的参数。
            # 没配 URL 就跳过——轮询兜底,别让作业因此变红。
            if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
              echo "没有配置 DEPLOY_HOOK_URL,交给目标机轮询"
              exit 0
            fi
            curl -fsS --max-time 300 -X POST "${DEPLOY_HOOK_URL}" \
              -H "X-Gwei-Channel: ${CHANNEL}" \
              ${DEPLOY_HOOK_TOKEN:+-H "X-Gwei-Token: ${DEPLOY_HOOK_TOKEN}"}
            echo
