<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观测采样 · Observer</title>
<style>
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
         margin: 0; padding: 24px; background: #0b0e14; color: #e6e8ee; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8b93a7; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .card { background: #141926; border: 1px solid #232a3d; border-radius: 10px; padding: 16px; }
  .label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #8b93a7; }
  .value { font-size: 26px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .desc { font-size: 11px; margin: 0; }
  .ok { color: #34d399; }
  .warn { color: #fbbf24; }
  footer { margin-top: 20px; font-size: 11px; color: #8b93a7; }
  .stale { color: #8b93a7; }
</style>
</head>
<body>
  <h1>观测采样</h1>
  <p class="sub">observer-agent · 实时指标(经只读桥,5s 轮询)</p>
  <div class="grid" id="grid">
    <div class="card">
      <div class="label">事件发布</div>
      <div class="value stale" id="m-events">–</div>
      <p class="desc">插件事件累计</p>
    </div>
    <div class="card">
      <div class="label">LLM 调用</div>
      <div class="value stale" id="m-llm">–</div>
      <p class="desc">感知分析累计</p>
    </div>
    <div class="card">
      <div class="label">Hook 否决</div>
      <div class="value stale" id="m-veto">–</div>
      <p class="desc">安全拦截累计</p>
    </div>
  </div>
  <footer id="foot">GweiOps · sandboxed plugin page — 正在连接只读桥…</footer>

<script>
  // 沙箱内无跨域 fetch 权限,经宿主只读桥拉取指标(白名单见宿主端)
  var seq = 0;
  var pending = {};

  function bridgeGet(path) {
    return new Promise(function (resolve) {
      var id = ++seq;
      pending[id] = resolve;
      window.parent.postMessage({ type: 'gwei:bridge:fetch', id: id, path: path }, '*');
      setTimeout(function () {
        if (pending[id]) { delete pending[id]; resolve({ ok: false, status: 504, body: null }); }
      }, 5000);
    });
  }

  window.addEventListener('message', function (ev) {
    var msg = ev.data;
    if (!msg || msg.type !== 'gwei:bridge:response') return;
    var resolve = pending[msg.id];
    if (resolve) { delete pending[msg.id]; resolve(msg); }
  });

  function setText(id, text, cls) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = 'value ' + (cls || '');
  }

  function metricValue(rows, name) {
    var total = 0;
    rows.forEach(function (r) { if (r.name === name) total += Number(r.value) || 0; });
    return total;
  }

  async function refresh() {
    var resp = await bridgeGet('/api/metrics');
    var foot = document.getElementById('foot');
    if (!resp.ok) {
      foot.textContent = '只读桥不可用(' + resp.status + '),显示离线状态';
      return;
    }
    var rows = resp.body || [];
    setText('m-events', metricValue(rows, 'plugin_events_published_total'), 'ok');
    setText('m-llm', metricValue(rows, 'gwei_llm_calls_total'), 'ok');
    setText('m-veto', metricValue(rows, 'plugin_hook_veto_total'), 'warn');
    foot.textContent = '已连接 · ' + new Date().toLocaleTimeString();
  }

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
