name: observer-agent
version: 1.0.0
type: agent
description: 观察智能体，监控系统状态
triggers:
- type: schedule
  interval: 60s
capabilities:
- system.monitor
- metrics.collect
class_name: ObserverAgent
ui:
  widgets:
  - slot: dashboard.bento
    kind: metric
    span: 2
    title: 观测总览
    metrics:
    - label: 事件发布
      value: 0
      sub: 累计
      variant: green
      metric:
        name: plugin_events_published_total
    - label: LLM 调用
      value: 0
      sub: 累计
      variant: green
      metric:
        name: gwei_llm_calls_total
    - label: Hook 否决
      value: 0
      sub: 累计
      variant: yellow
      metric:
        name: plugin_hook_veto_total
  pages:
  - title: 观测采样
    entry: index.html
