name: observer-agent
version: 1.0.0
type: agent
description: 观察智能体，监控系统状态
triggers:
- type: schedule
  interval: 60s
capabilities:
- system.monitor
- metrics.collect
class_name: ObserverAgent
ui:
  widgets:
  - slot: dashboard.bento
    kind: metric
    span: 1
    title: 观测采样
    metrics:
    - label: 采样间隔
      value: 60s
      sub: 周期触发(静态演示)
      variant: green
