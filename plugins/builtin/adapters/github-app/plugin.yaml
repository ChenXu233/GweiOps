name: github-app-adapter
version: 1.0.0
type: adapter
class_name: GitHubAppAdapter
description: GitHub App 适配器，通过 GitHub App 进行认证和交互

capabilities:
  - issue.read
  - issue.write
  - comment.read
  - comment.write
  - label.write
  - webhook.receive
  - webhook.verify
  - comment.create
  - pr.open

tasks:
  comment.create: create_comment

# 两个 GitHub 适配器并存,默认选这个:内部走 App 认证
capabilities_priority:
  issue.read: 10
  issue.write: 10
  comment.read: 10
  comment.write: 10
  label.write: 10
  webhook.receive: 10
  webhook.verify: 10
  comment.create: 10
  pr.open: 10

effects:
  comment.create:
    label: 在 Issue / PR 上发一条评论
    execute: { task: create_comment, args: [repo, issue_number, body] }
    undo: { task: delete_comment, kind: symmetric }
    window: { read: comment_present }
    verify:
      - { query: comment_exists, expect: "true" }
  # 一个 PR 就是一个变更单元:分支 + 提交 + 合并请求是一次效果,
  # 撤销是关掉它并删掉分支;合并之后窗口就关了,那时候要撤是另一次变更。
  pr.open:
    label: 开一个 PR(建分支、提交、发起合并请求)
    execute: { task: open_pull, args: [repo, base, head, title, body, files] }
    undo: { task: close_pull, kind: symmetric }
    window: { read: pull_open }
    verify:
      - { query: pull_open, expect: "true" }

config:
  required:
    - GITHUB_APP_APP_ID
    - GITHUB_APP_PRIVATE_KEY
  optional:
    - GITHUB_APP_WEBHOOK_SECRET
    - GITHUB_APP_INSTALLATION_ID
