name: github-app-adapter
version: 1.0.0
type: adapter
class_name: GitHubAppAdapter
description: GitHub App 适配器，通过 GitHub App 进行认证和交互

triggers:
  - type: event
    events:
      - webhook.received

capabilities:
  - issue.read
  - issue.write
  - comment.read
  - comment.write
  - label.write
  - webhook.receive
  - webhook.verify
  - comment.create

tasks:
  comment.create: create_comment

effects:
  comment.create:
    label: 在 Issue / PR 上发一条评论
    execute: { task: create_comment, args: [repo, issue_number, body] }
    undo: { task: delete_comment, kind: symmetric }
    window: { read: comment_present }
    verify:
      - { query: comment_exists, expect: "true" }

config:
  required:
    - GITHUB_APP_APP_ID
    - GITHUB_APP_PRIVATE_KEY
  optional:
    - GITHUB_APP_WEBHOOK_SECRET
    - GITHUB_APP_INSTALLATION_ID
