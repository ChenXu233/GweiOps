name: github-adapter
version: 1.0.0
type: adapter
description: GitHub 托管适配器
triggers:
- type: event
  events:
  - webhook.received
  - issue.created
  - pr.merged
capabilities:
- issue.read
- issue.write
- pr.read
- pr.write
- pr.merge
- comment.read
- comment.write
- webhook.receive
config:
  required:
  - GITHUB_TOKEN
  - GITHUB_WEBHOOK_SECRET
  optional:
  - GITHUB_API_URL
class_name: GitHubAdapter
# 备选实现:默认不加载,需要时把 default_enabled 改成 true 或设 PLUGINS_ENABLED=github-adapter
default_enabled: false
